
<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Fun! | Listening & Speaking</title>
<style>
:root{--ink:#302b4a;--purple:#d8c8ff;--pink:#ffd8e9;--yellow:#fff0ac;--green:#c9f3d8;--blue:#ccecff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(120deg,#d7ecff,#ffe0ef 52%,#fff1bd);min-height:100vh}
main{max-width:1040px;margin:auto;padding:18px}.panel{background:#fffefb;border:3px solid #fff;border-radius:30px;padding:clamp(20px,4vw,42px);box-shadow:0 12px 32px #5b4b9122;min-height:580px;animation:rise .3s}
h1{font-size:clamp(2.1rem,6vw,3.7rem);margin:12px 0}h2{font-size:clamp(1.5rem,4vw,2.4rem)}p{font-size:1.12rem;line-height:1.55}.tag{display:inline-block;border-radius:99px;background:var(--purple);padding:9px 17px;font-weight:800}
button,input{font:inherit}button{border:2px solid #4b436a18;border-radius:17px;padding:13px 18px;background:var(--purple);color:var(--ink);font-weight:800;cursor:pointer;transition:transform .15s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #6d52c3;outline-offset:3px}button:disabled{opacity:.6;cursor:not-allowed}
.green{background:var(--green)}.pink{background:var(--pink)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}
.center{text-align:center}.hero{font-size:clamp(4rem,11vw,7rem);margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin:22px 0}.tile{background:var(--blue);border-radius:20px;padding:18px;text-align:center}.tile:nth-child(3n+2){background:var(--pink)}.tile:nth-child(3n){background:var(--yellow)}.icon{font-size:3.5rem;display:block}.tile strong{display:block;margin:8px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:25px}.answers{display:grid;gap:12px;margin:20px 0}.answers button{text-align:left;background:var(--blue);font-size:1.13rem}.answers button:nth-child(even){background:var(--pink)}.answers button.good{background:#a9e7b5}.answers button.bad{background:#ffc1c1}
.feedback{padding:17px;background:var(--yellow);border-radius:20px;margin:15px 0;font-weight:700}.muted{font-size:.94rem;color:#625b75}.big{font-size:1.7rem;font-weight:900}.bar{height:13px;background:#eae5f6;border-radius:20px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#a78be9;transition:width .3s}input{padding:12px;border:2px solid #b7a4ed;border-radius:14px;max-width:100%}
.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pair button{min-width:125px}.selected{outline:4px solid #7660d7}.done{opacity:.55}.confetti{font-size:3rem;animation:bounce .6s infinite alternate}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes bounce{to{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><section class="panel" id="screen" aria-live="polite"></section></main><script>
"use strict";
const items=[["🍎","apple"],["🍌","banana"],["🍞","bread"],["🍚","rice"],["🍗","chicken"],["🍦","ice cream"],["💧","water"],["🥛","milk"],["🧃","juice"],["🍵","tea"],["☕","coffee"]];
const qs=[
{kind:"listen",audio:"I like apples.",prompt:"Listen. Which food do I like?",opts:["🍌 Bananas","🍎 Apples","🍞 Bread"],correct:1,explain:"I like apples artinya saya suka apel."},
{kind:"listen",audio:"I don't like milk.",prompt:"Listen. Which drink don't I like?",opts:["🥛 Milk","🧃 Juice","💧 Water"],correct:0,explain:"I don't like milk artinya saya tidak suka susu."},
{kind:"choice",prompt:"Pilih kalimat untuk 👍 🍌",opts:["I don't like bananas.","I like bananas.","I like tea."],correct:1,explain:"I like = saya suka."},
{kind:"choice",prompt:"Pilih kalimat untuk 👎 ☕",opts:["I like coffee.","I like milk.","I don't like coffee."],correct:2,explain:"I don't like = saya tidak suka."},
{kind:"tf",prompt:"'I like water' artinya 'Saya suka air putih'.",opts:["✅ True","❌ False"],correct:0,explain:"Benar. I like = saya suka."},
{kind:"tf",prompt:"'I don't like tea' artinya 'Saya suka teh'.",opts:["✅ True","❌ False"],correct:1,explain:"Salah. I don't like tea = saya tidak suka teh."},
{kind:"tf",prompt:"'I like ice cream' menyatakan kesukaan.",opts:["✅ True","❌ False"],correct:0,explain:"Benar. I like menyatakan kesukaan."},
{kind:"match",prompt:"Match! 🍗 = ...",opts:["Juice","Chicken","Bread"],correct:1,explain:"Chicken artinya ayam."},
{kind:"match",prompt:"Match! 🧃 = ...",opts:["Juice","Tea","Milk"],correct:0,explain:"Juice artinya jus."},
{kind:"listen",audio:"I don't like bananas.",prompt:"Listen. Which sentence did you hear?",opts:["I like bananas.","I don't like apples.","I don't like bananas."],correct:2,explain:"I don't like bananas = saya tidak suka pisang."}
];
let page=0,name="",qIndex=0,score=0,attempts=0,locked=false,chosen=-1,said=false,reflection="",speechStatus="",matchPicked=-1,matchSolved=[],matchStep=0;
const el=document.getElementById("screen");const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const button=(label,fn,cl="")=>`<button class="${cl}" onclick="${fn}">${label}</button>`;
function tts(t){if(!("speechSynthesis" in window)){alert("Perangkat ini tidak mendukung suara otomatis.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.76;u.pitch=1.08;speechSynthesis.speak(u)}
function navigate(n){page=n;render()}function home(){navigate(0)}
function nav(prev,next,label="Next ➜"){return `<div class="actions">${button("⬅ Back",prev,"pink")}${button("🏠 Home","home()","yellow")}${button(label,next,"green")}</div>`}
function speech(text){said=true;document.getElementById("speakingText").textContent=text;tts(text);document.getElementById("nextSpeaking").disabled=false}
function microphone(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){speechStatus="🎤 Pengenalan suara belum didukung browser ini. Tetap ucapkan kalimatmu dan minta guru/teman menyimak.";render();return}
const target=document.getElementById("speakingText").textContent;if(target.includes("...")){speechStatus="Pilih kalimat terlebih dahulu.";render();return}
let r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const heard=e.results[0][0].transcript;const normalize=s=>s.toLowerCase().replace(/[^\w\s]/g,"").trim();speechStatus=normalize(heard)===normalize(target)?`🌟 Excellent! I heard: "${heard}"`:`💪 I heard: "${heard}". Coba ulangi: "${target}"`;render()};r.onerror=e=>{speechStatus="Mikrofon tidak tersedia atau izin ditolak. Kamu tetap bisa latihan bersama guru.";render()};try{r.start()}catch(e){speechStatus="Mikrofon tidak bisa dimulai.";render()}}
function startQuiz(){page=5;qIndex=0;score=0;attempts=0;locked=false;chosen=-1;render()}
function pick(i){if(locked)return;chosen=i;attempts++;const q=qs[qIndex];if(i===q.correct){score++;locked=true}else{locked=false}render()}
function nextQ(){qIndex++;chosen=-1;locked=false;if(qIndex>=qs.length)page=6;render()}
function resetMatch(){matchStep=0;matchPicked=-1;matchSolved=[];render()}
function choosePicture(i){if(matchSolved.includes(i))return;matchPicked=i;render()}
function chooseWord(i){if(matchPicked<0){speechStatus="Pilih gambar dahulu!";render();return}const expected=[2,0,1][matchPicked];if(i===expected){matchSolved.push(matchPicked);speechStatus="🌟 Correct match!"}else speechStatus="💪 Try again! Cocokkan gambar dengan kata yang tepat.";matchPicked=-1;render()}
function render(){
let h="";
if(page===0)h=`<div class="center"><span class="tag">🎧 Listening & Speaking • Bahasa Inggris Kelas 3 SD</span><div class="hero">🍎 🥛 🍌</div><h1>FOOD FUN!</h1><h2>I Like It! 💖 I Don't Like It! 🙅</h2><p>Let's listen, speak, and play!</p><p>Nama murid: <input id="studentName" aria-label="Nama murid" value="${escapeHtml(name)}" placeholder="Tulis namamu"></p>${button("🚀 START","name=document.getElementById('studentName').value.trim();navigate(1)","green")}</div>`;
if(page===1)h=`<span class="tag">🎯 Learning Objectives</span><h1>Today I Can...</h1><div class="cards"><div class="tile"><span class="icon">🍎</span>Mengenali nama makanan dan minuman</div><div class="tile"><span class="icon">🎧</span>Mendengarkan kalimat sederhana</div><div class="tile"><span class="icon">🎤</span>Mengucapkan <b>I like...</b> dan <b>I don't like...</b></div></div>${nav("home()","navigate(2)")}`;
if(page===2)h=`<span class="tag">📚 Vocabulary</span><h1>Food & Drinks</h1><p>Tap each picture and listen! 🔊</p><div class="cards">${items.map(([emoji,word])=>`<button class="tile" onclick="tts('${word}')"><span class="icon">${emoji}</span><strong>${word}</strong>🔊 Listen</button>`).join("")}</div>${nav("navigate(1)","navigate(3)")}`;
if(page===3)h=`<span class="tag">💬 Learn the Sentences</span><h1>Let's Say It!</h1><div class="cards"><div class="tile"><span class="icon">👍 🍎</span><p class="big">I like apples.</p><p>Saya suka apel.</p>${button("🔊 Listen","tts('I like apples.')","green")}</div><div class="tile"><span class="icon">👎 ☕</span><p class="big">I don't like coffee.</p><p>Saya tidak suka kopi.</p>${button("🔊 Listen","tts(\"I don't like coffee.\")","green")}</div></div><p>💡 <b>I like...</b> = Saya suka...<br>💡 <b>I don't like...</b> = Saya tidak suka...</p>${nav("navigate(2)","navigate(4)")}`;
if(page===4)h=`<span class="tag">🎤 Speaking Challenge</span><h1>Speak Up!</h1><p>Pilih gambar, tekan 👍 atau 👎, dengarkan, lalu ucapkan dengan suara keras.</p><div class="cards">${items.slice(0,8).map(([e,w])=>`<div class="tile"><span class="icon">${e}</span><strong>${w}</strong><div class="pair">${button("👍 Like",`speech('I like ${w}.')`,"green")}${button("👎 Don't like",`speech(\"I don't like ${w}.\")`,"pink")}</div></div>`).join("")}</div><div class="center"><p id="speakingText" class="big">${escapeHtml(window.lastSpeaking||"I like... / I don't like...")}</p>${button("🎙️ Check My Speaking","microphone()","blue")}<p class="muted">Pengenalan suara opsional: biasanya memerlukan HTTPS, izin mikrofon, dan browser yang mendukung. Jika tidak tersedia, guru/teman menyimak.</p><div class="feedback">${escapeHtml(speechStatus||"Listen • Repeat • Speak!")}</div></div><div class="actions">${button("⬅ Back","navigate(3)","pink")}${button("🏠 Home","home()","yellow")}<button id="nextSpeaking" class="green" onclick="navigate(45)" ${said?"":"disabled"}>🎲 Matching Game ➜</button></div>`;
if(page===45){const pics=["🍎","🥛","🍌"],words=["milk","banana","apple"];h=`<span class="tag">🧩 Matching Game</span><h1>Match the Pairs!</h1><p>Pilih gambar di kiri, lalu pilih kata Bahasa Inggris yang cocok di kanan.</p><div class="cards" style="grid-template-columns:1fr 1fr"><div class="tile"><h2>Pictures</h2>${pics.map((e,i)=>`<p>${button(e,`choosePicture(${i})`,`${matchPicked===i?"selected":""} ${matchSolved.includes(i)?"done":""}`)}</p>`).join("")}</div><div class="tile"><h2>Words</h2>${words.map((w,i)=>`<p>${button(w,`chooseWord(${i})`,"blue")}</p>`).join("")}</div></div><div class="feedback">${escapeHtml(speechStatus||"Match all 3 pairs!")}</div><p>Pairs: ${matchSolved.length}/3</p><div class="actions">${button("⬅ Back","navigate(4)","pink")}${button("🔄 Reset","resetMatch()","yellow")}${button("🧩 Start Quiz ➜","startQuiz()","green")}</div>`;}
// Match uses dedicated side selection to avoid ambiguity.
if(page===5){let q=qs[qIndex],wrong=chosen>=0&&chosen!==q.correct;h=`<span class="tag">🧩 Quiz ${qIndex+1}/10 • ${q.kind.toUpperCase()}</span><div class="bar"><div style="width:${(qIndex+1)*10}%"></div></div><h2>${q.prompt}</h2>${q.audio?`<p>${button("🔊 PLAY AUDIO","tts(qs[qIndex].audio)","yellow")} <span class="muted">Dengarkan kalimatnya.</span></p>`:""}<div class="answers">${q.opts.map((o,i)=>`<button class="${locked&&i===q.correct?"good":wrong&&i===chosen?"bad":""}" onclick="pick(${i})" ${locked?"disabled":""}>${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>${chosen>=0?`<div class="feedback">${locked?"🌟 Excellent! Well done!":"💪 Good try! "+q.explain+" Pilih lagi, ya!"}${locked?`<p class="muted">${q.explain}</p>`:""}</div>`:"<p class='muted'>Pilih jawaban yang paling tepat.</p>"}${locked?`<div class="actions">${button(qIndex===9?"🏆 See My Result":"Next Question ➜","nextQ()","green")}</div>`:""}`;}
if(page===6)h=`<div class="center"><span class="tag">🏆 Quiz Result</span><div class="hero">${score>=8?"🏆":"🌈"}</div><h1>Great Job${name?", "+escapeHtml(name):""}!</h1><h2>Score: ${score}/10</h2><p>${score>=8?"Amazing! You did it!":score>=5?"Good effort! Keep practicing!":"Keep trying! You can do it!"}</p>${button("🔁 Try Again","startQuiz()","yellow")} ${button("💭 Reflection","navigate(7)","green")}</div>`;
if(page===7)h=`<span class="tag">💭 Reflection</span><h1>How Do You Feel?</h1><div class="cards">${[["😊","I understand!"],["😐","I need more practice."],["🙋","I need help."]].map(([e,w])=>`<button class="tile" onclick="reflection=${JSON.stringify(w)};render()"><span class="icon">${e}</span>${w}</button>`).join("")}</div><div class="feedback">${reflection?"Thank you! "+escapeHtml(reflection):"Choose your feeling!"}</div><h2>Say it one more time!</h2><p class="big">I like ______.<br>I don't like ______.</p>${nav("navigate(6)","navigate(8)")}`;
if(page===8)h=`<div class="center"><span class="tag">🎉 Finished!</span><div class="hero">🌟 🎈 🍓</div><h1>YOU DID IT!</h1><p class="big">Keep Learning English and Have Fun!</p><p>Hebat! Kamu sudah mendengar, berbicara, dan berlatih.</p>${button("🏠 Play Again","said=false;speechStatus='';reflection='';home()","green")}</div>`;
el.innerHTML=h;
if(page===4){const st=document.getElementById("speakingText");if(st&&window.lastSpeaking)st.textContent=window.lastSpeaking;}
}
const originalSpeech=speech;speech=function(t){window.lastSpeaking=t;originalSpeech(t)};
render();
</script></body></html>
